{% if pagina.paginator.num_pages > 1 %}
<nav class="paginacion" aria-label="Paginación">
  {% if pagina.has_previous %}
  <a href="?page={{ pagina.previous_page_number }}&amp;q={{ request.GET.q|urlencode }}">Anterior</a>
  {% endif %}
  <span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>
  {% if pagina.has_next %}
  <a href="?page={{ pagina.next_page_number }}&amp;q={{ request.GET.q|urlencode }}">Siguiente</a>
  {% endif %}
</nav>
{% endif %}
